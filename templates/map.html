<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Карта столовых</title>
    <meta charset="utf-8" />
    <script src="https://api-maps.yandex.ru/2.1/?apikey=175a8bae-d70a-42fe-9598-1f19089894eb&lang=ru_RU" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; }
        #map { width: 100%; height: 500px; border-radius: 10px; }
        .status { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="status" id="status">Определение позиции...</div>
    <div id="map"></div>

    <script type="text/javascript">
        let myMap;

        ymaps.ready(init);

        function init() {
            // Сразу пробуем получить позицию
            ymaps.geolocation.get({
                provider: 'browser',
                mapStateAutoApply: true,
                enableHighAccuracy: false
            }).then(function (result) {
                const coords = result.geoObjects.get(0).geometry.getCoordinates();
                setupMap(coords);
            }, function () {
                // Если браузер не дал GPS, берем примерную позицию по IP
                ymaps.geolocation.get({ provider: 'yandex', mapStateAutoApply: true })
                    .then(res => setupMap(res.geoObjects.get(0).geometry.getCoordinates()));
            });
        }

        function setupMap(center) {
            myMap = new ymaps.Map("map", {
                center: center,
                zoom: 15,
                controls: ['zoomControl', 'searchControl']
            });

            // Добавляем вашу метку
            myMap.geoObjects.add(new ymaps.Placemark(center, {
                hintContent: 'Вы здесь'
            }, { preset: 'islands#blueCircleDotIconWithCaption' }));

            // Запускаем поиск
            startSearch();

            // Обновляем при движении
            myMap.events.add('actionend', startSearch);
        }

        function startSearch() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Связь с сервером Яндекса...";

            // Поиск по всему городу, а не только в узком квадрате
            ymaps.search("столовая", {
                // Убираем strictBounds, чтобы искать шире, если в центре пусто
                strictBounds: false,
                boundedBy: myMap.getBounds(),
                results: 50
            }).then(function (res) {
                const count = res.geoObjects.getLength();

                if (count > 0) {
                    statusEl.innerText = "Найдено объектов: " + count;
                    // Красим метки в красный
                    res.geoObjects.options.set('preset', 'islands#redFoodIcon');
                    myMap.geoObjects.add(res.geoObjects);
                } else {
                    statusEl.innerText = "Яндекс не вернул объектов. Попробуйте другой район.";
                }
            }).catch(err => {
                statusEl.innerText = "Ошибка API. Проверьте лимиты в Кабинете разработчика.";
                console.error("Детали ошибки:", err);
            });
        }
    </script>
</body>
</html>
